name: Deploy A2A Comms

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run of this workflow at a time. The self-hosted runner serialises JOBS,
# not RUNS, so without this an earlier run's deploy job starts after a later
# run's lint job has already finished — and pulls a commit it was never testing.
# cancel-in-progress is deliberately false: a deploy half-way through a Traefik
# switch must be allowed to finish.
concurrency:
  group: deploy-main
  cancel-in-progress: false

# Creating a release writes to contents. Everything else here only reads, so
# this is the narrowest grant that lets the release step work.
permissions:
  contents: write

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  lint-and-build:
    runs-on: self-hosted
    timeout-minutes: 20
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Pull latest
        run: |
          cd /root/projects/a2a-comms
          git pull origin main

      - name: Clean .next cache
        run: |
          cd /root/projects/a2a-comms
          sudo chown -R runner:runner .next 2>/dev/null || true
          rm -rf .next node_modules/.cache

      - name: Install dependencies
        run: |
          cd /root/projects/a2a-comms
          corepack pnpm install --frozen-lockfile

      - name: Test
        run: |
          cd /root/projects/a2a-comms
          corepack pnpm test

      - name: Test reactor (python, stdlib only)
        run: |
          cd /root/projects/a2a-comms/reactor
          python3 -m unittest discover -s tests

      - name: Lint
        run: |
          cd /root/projects/a2a-comms
          corepack pnpm exec eslint .

      - name: Build
        run: |
          cd /root/projects/a2a-comms
          corepack pnpm exec next build

      # The unit suite is all pure functions and nothing else applies the
      # migrations, so without this nobody checks that they still apply, that
      # the app boots against the resulting schema, or that a signed request
      # reaches a route. Runs after Build because it starts the built app.
      # Self-contained: its own postgres container, its own ports, destroyed on
      # exit, and it never touches production.
      # The migrations must produce the schema that is actually running. They
      # drifted three times in two days — a status the app wrote and the CHECK
      # refused, and twice a constraint widened in production by hand that no
      # migration reproduced. Reading either side alone cannot see any of it,
      # and a schema_migrations ledger would not have either: the question is
      # not which files ran, it is whether the result matches.
      - name: Verify the migrations build the running schema
        run: |
          cd /root/projects/a2a-comms
          ./scripts/verify-schema.sh

      - name: Verify end-to-end (migrations, boot, signed request)
        run: |
          cd /root/projects/a2a-comms
          ./scripts/verify-e2e.sh

      - name: Build worker images
        run: |
          cd /root/projects/a2a-comms
          docker compose -f docker-compose.yml build webhook-worker invitation-sweep-worker stale-blocker-sweep-worker stale-run-sweep-worker

  deploy:
    needs: lint-and-build
    runs-on: self-hosted
    timeout-minutes: 10
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Capture commit info
        id: commit
        run: |
          COMMIT_MSG=$(cd /root/projects/a2a-comms && git log -1 --format='%h %s')
          echo "msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          # The SHA is passed as an argument, not an env var: this runs under
          # sudo, which strips the environment.
          VERSION=$(sudo /root/projects/a2a-comms/scripts/ci-deploy.sh "${{ github.sha }}" | tail -1)
          if [ -z "$VERSION" ]; then
            echo "ci-deploy.sh completed but did not emit a version" >&2
            exit 1
          fi
          if [ "$VERSION" = "SUPERSEDED" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "A newer commit is already on main; the run that owns it deploys both."
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A tag is a pointer; a release is the page a newcomer actually lands on.
      # AC-76 gave this repo tags for the first time after 328 versions, and
      # nothing turned one into a release — so a public repository with a
      # 4,000-line changelog had an empty /releases.
      #
      # The notes come from the CHANGELOG section ci-deploy.sh has just written
      # from the commits this release really contains. One source of truth: a
      # release cannot claim something the changelog does not say.
      #
      # Like the tag push, this must never fail a deploy that has already
      # succeeded — the code is live either way, and a missing release page is
      # a thing to notice, not a thing to roll back for.
      - name: Publish the release
        if: success() && steps.deploy.outputs.superseded != 'true'
        run: |
          cd /root/projects/a2a-comms
          VERSION="${{ steps.deploy.outputs.version }}"
          ./scripts/publish-release.sh "$VERSION" || \
            echo "WARN: v$VERSION deployed but its release page was not created" >&2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Clean .next after deploy
        if: always()
        run: |
          cd /root/projects/a2a-comms
          sudo chown -R runner:runner .next 2>/dev/null || true
          rm -rf .next node_modules/.cache

      - name: Notify Discord (success)
        if: success() && steps.deploy.outputs.superseded != 'true' 
        run: |
          VERSION="${{ steps.deploy.outputs.version }}"
          COMMIT_MSG="${{ steps.commit.outputs.msg }}"
          BODY="{\"content\": \"✅ **A2A Comms v${VERSION} deployed** — \`${COMMIT_MSG}\`\"}"
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: A2AComms-CI/1.0" \
            -d "$BODY" || true

      - name: Notify Discord (deploy failure)
        if: failure()
        run: |
          COMMIT_MSG=$(cd /root/projects/a2a-comms && git log -1 --format='%h %s' 2>/dev/null || echo "unknown")
          BODY="{\"content\": \"❌ **A2A Comms deploy FAILED** — \`${COMMIT_MSG}\`\nCheck: <https://github.com/${{ github.repository }}/actions>\"}"
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: A2AComms-CI/1.0" \
            -d "$BODY" || true

  notify-ci-failure:
    needs: lint-and-build
    runs-on: self-hosted
    if: failure()
    steps:
      - name: Notify Discord (CI failure)
        run: |
          COMMIT_MSG=$(cd /root/projects/a2a-comms && git log -1 --format='%h %s' 2>/dev/null || echo "unknown")
          BODY="{\"content\": \"❌ **A2A Comms CI failed** (lint/build) — \`${COMMIT_MSG}\`\nCheck: <https://github.com/${{ github.repository }}/actions>\"}"
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: A2AComms-CI/1.0" \
            -d "$BODY" || true
